name: Publish approved prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact preview tag and reviewed publication evidence
        shell: pwsh
        run: ./scripts/build-release.ps1 -Tag $env:GITHUB_REF_NAME -Publication

  checks:
    needs: policy
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    needs: [policy, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rebuild checked commit (never consume untrusted external artifacts)
        shell: pwsh
        run: ./scripts/build-release.ps1 -Tag $env:GITHUB_REF_NAME -Publication
      - name: Create immutable prerelease, never stable or Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          test "$current" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/kocom_wallpad.zip dist/kocom_wallpad.zip.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title "$GITHUB_REF_NAME" --generate-notes
